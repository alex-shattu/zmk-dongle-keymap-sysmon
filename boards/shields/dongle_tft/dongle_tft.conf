# ZMK dongle + ST7789V 240x240 TFT + host system monitor.
#
# The mono theme forces every widget to black and white; it exists for 1 bpp
# OLEDs and must not be applied to a colour panel.

CONFIG_ZMK_DISPLAY=y

# The bottom half is a system monitor: it is useless if it blanks after the
# idle timeout, so the panel stays lit for as long as the dongle is powered.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

CONFIG_LV_USE_THEME_MONO=n

# Battery levels of both halves in the status row.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Caps lock in the modifier row.
CONFIG_ZMK_HID_INDICATORS=y

# Display bus
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V_RGB565=y

# Backlight (pwm-leds, chosen zmk,display-led)
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# Sysmon CDC-ACM link (a second USB function next to HID)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
