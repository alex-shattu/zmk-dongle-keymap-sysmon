[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmon-daemon"
version = "0.1.0"
description = "Mac system metrics daemon feeding the standalone sysmon display over CDC-ACM serial (S3 protocol)"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["sysmon_daemon*"]
